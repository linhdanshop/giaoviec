<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo Nhắc Việc Shop</title>
<style>
  :root{
    --bg:#eef2f7;--card:#fff;--text:#172033;--muted:#667085;--line:#dbe3ef;
    --pri:#2563eb;--pri2:#1d4ed8;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;
    --soft:#f8fafc;--head:#0f172a;--shadow:0 8px 24px #0f172a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#f7f9fd 0,#eef2f7 100%);font-family:Arial, Tahoma, 'Helvetica Neue', sans-serif;color:var(--text);font-size:14px;font-weight:400;-webkit-font-smoothing:auto;text-rendering:auto}
  .top{position:sticky;top:0;z-index:10;background:var(--head);color:white;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 2px 12px #0003}
  .brand{font-size:18px;font-weight:700;letter-spacing:0}.device{font-size:12px;color:#cbd5e1}.wrap{padding:12px;max-width:1540px;margin:auto}
  .tabs,.filters,.panel,.table-wrap{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .tabs{padding:8px;display:flex;gap:8px;margin-bottom:10px}.tab{border:0;border-radius:10px;padding:10px 15px;background:#eef2f7;font-weight:600;cursor:pointer}.tab.active{background:var(--pri);color:white;box-shadow:0 6px 18px #2563eb44}
  .filters{padding:10px;display:grid;grid-template-columns:135px 165px 155px 1fr 125px 130px;gap:8px;align-items:end;margin-bottom:10px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:700} input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;font-size:14px;outline:none} input:focus,select:focus,textarea:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #2563eb18} textarea{min-height:72px;resize:vertical}
  button{border:0;border-radius:10px;padding:9px 12px;font-weight:600;cursor:pointer}.btn{background:var(--pri);color:white}.btn:hover{background:var(--pri2)}.btn2{background:#e9edf4;color:#111827}.btn-ok{background:var(--ok);color:white}.btn-bad{background:var(--bad);color:white}.btn-warn{background:var(--warn);color:#111827}
  .grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:10px}.grid.form-collapsed{grid-template-columns:1fr}.grid.form-collapsed #formPanel{display:none!important}.quickbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.quickbar .left{font-weight:700;color:#172033}.quickbar .right{display:flex;gap:8px}.table-full{width:100%}.panel{padding:12px}.panel h3{margin:0 0 10px;font-size:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 3px 10px #0f172a0a}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .table-wrap{overflow:auto;max-height:calc(100vh - 265px)}.task-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1280px;table-layout:fixed}.task-table th{position:sticky;top:0;background:#f1f5f9;z-index:3;text-align:center;color:#1f2937;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-bottom:2px solid #cbd5e1;padding:12px 9px;white-space:nowrap}.task-table td{border-bottom:1px solid var(--line);padding:10px 10px;vertical-align:top;background:white;line-height:1.35}.task-table tr:hover td{background:#f8fbff}.task-table tr.late-row td{background:#fff7ed}.task-table tr.todo-row td{background:#fffafa}
  .time{font-weight:700;color:#111827;font-size:15px}.title{font-weight:700;color:#111827;font-size:15px}.small{font-size:12px;color:var(--muted)}.content{max-width:300px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.note{white-space:pre-wrap;line-height:1.35}.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.morebtn{margin-top:4px;background:transparent;color:#2563eb;padding:0;font-size:12px;font-weight:700}.note-edit{min-height:38px;height:42px;padding:7px 8px;font-size:13px;border-radius:8px;line-height:1.25;resize:vertical;background:#fff}.autosaved{font-size:11px;color:#16a34a;margin-top:2px;display:none}.autosaved.show{display:block}.badge{display:inline-block;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}.todo{background:#fee2e2;color:#991b1b}.done{background:#dcfce7;color:#166534}.late{background:#ffedd5;color:#9a3412}.wait{background:#e0f2fe;color:#075985}.repeat{background:#ede9fe;color:#5b21b6}.imgthumb{width:48px;height:48px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f1f5f9}
  .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.actions button{padding:7px 10px;font-size:12px;white-space:nowrap}.actions.compact{gap:4px}.actions.compact button{padding:6px 8px;border-radius:8px;font-size:12px}.btn-text{background:transparent;color:#2563eb;padding:4px 0!important}.btn-edit{background:#e9edf4;color:#111827}.btn-danger{background:#fee2e2;color:#991b1b}.btn-done{background:#16a34a;color:white}.btn-reopen{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}.hidden{display:none!important}.mutedBox{background:#f8fafc;border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--muted);font-size:13px}
  .modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.modal.show{display:flex}.box{background:white;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 70px #0007}.box h2{margin:0 0 8px}.box img{max-width:100%;border-radius:12px;border:1px solid var(--line)}.log{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;font-size:13px}.toast{position:fixed;right:14px;bottom:14px;background:#111827;color:white;border-radius:16px;padding:14px;z-index:50;display:none;max-width:360px;box-shadow:0 10px 35px #0006}.toast.show{display:block}.toast h3{margin:0 0 6px}.toast .actions{margin-top:10px}
  .admin-only-note{margin-bottom:10px}.mobile-hint{display:none}
  @media(max-width:900px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.brand{font-size:15px}.table-wrap{max-height:none}.mobile-hint{display:block}}
</style>
</head>
<body>
<div class="top">
  <div><div class="brand">🔔 Demo Nhắc Việc Shop - Bảng cũ nâng cấp</div><div class="device" id="deviceText"></div></div>
  <div style="display:flex;gap:8px;align-items:center">
    <select id="role" style="width:130px"><option value="admin">Admin</option><option value="staff">Nhân viên</option></select>
    <button class="btn2" onclick="resetDemo()">Reset demo</button>
  </div>
</div>
<div class="wrap">
  <div class="tabs">
    <button class="tab active" data-tab="today" onclick="setTab('today')">Hôm nay</button>
    <button class="tab" data-tab="repeat" onclick="setTab('repeat')">Việc lặp lại</button>
    <button class="tab" data-tab="devices" onclick="setTab('devices')">Thiết bị online</button>
  </div>
  <div class="filters">
    <div><label>Ngày</label><input type="date" id="filterDate"></div>
    <div><label>Nhân viên</label><select id="filterStaff"></select></div>
    <div><label>Trạng thái</label><select id="filterStatus"><option value="all">Tất cả</option><option value="todo">Chưa làm</option><option value="done">Đã xong</option><option value="late">Quá giờ</option></select></div>
    <div><label>Tìm kiếm</label><input id="filterSearch" placeholder="Tên CV / nội dung / ghi chú"></div>
    <button class="btn" onclick="render()">Lọc</button>
    <button class="btn2" onclick="showAllToday()">Hôm nay</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="quickbar" id="quickbar"><div class="left">📋 Danh sách công việc</div><div class="right admin-only"><button class="btn" id="toggleFormBtn" onclick="toggleForm()">➕ Thêm việc</button></div></div>
  <div class="grid form-collapsed" id="mainGrid">
    <div class="panel admin-only" id="formPanel">
      <h3 id="formTitle">Thêm việc theo ngày</h3>
      <div class="form-grid">
        <div><label>Thời gian</label><input type="time" id="time"></div>
        <div><label>Nhân viên</label><select id="staff"></select></div>
        <div class="full"><label>Tên CV</label><input id="title" placeholder="VD: Gọi đơn nháp"></div>
        <div class="full"><label>Nội dung cần làm</label><textarea id="content"></textarea></div>
        <div class="full"><label>Ảnh hiển thị URL hoặc chọn ảnh</label><input id="imageUrl" placeholder="Dán link ảnh hoặc bỏ trống"></div>
        <div class="full"><input type="file" id="imageFile" accept="image/*"></div>
        <div class="full"><label>Admin ghi chú</label><textarea id="adminNote"></textarea></div>
        <div class="full" id="repeatOptions"><label><input type="checkbox" id="isRepeat" style="width:auto"> Lặp lại mỗi ngày</label></div>
        <div class="full actions"><button class="btn" onclick="saveTask()">Lưu việc</button><button class="btn2" onclick="clearForm()">Xóa form</button><button class="btn2" onclick="toggleForm(false)">Ẩn bảng thêm</button></div>
      </div>
    </div>
    <div>
      <div class="table-wrap"><table class="task-table"><colgroup id="colgroup"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
  </div>
</div>
<div class="modal" id="detailModal"><div class="box"><div id="detailBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const LS='shop_tasks_demo_v4';
const staffs=['An','Nguyệt','Thủy','Linh','Tất cả'];
let state={tab:'today',editId:null,deviceId:null,formOpen:false};
function today(){return new Date().toISOString().slice(0,10)}
function nowTime(){return new Date().toTimeString().slice(0,5)}
function uid(){return 'id_'+Date.now()+'_'+Math.random().toString(16).slice(2)}
function load(){let d=localStorage.getItem(LS); if(d) return JSON.parse(d); const data=seed(); localStorage.setItem(LS,JSON.stringify(data)); return data}
function save(data){localStorage.setItem(LS,JSON.stringify(data))}
function seed(){const t=today(); return {employees:['An','Nguyệt','Thủy','Linh'], devices:{}, daily:[
{id:uid(),date:t,time:'08:00',title:'Check tin nhắn mới',content:'Kiểm tra tin nhắn khách chưa trả lời, ưu tiên khách hỏi size và đổi địa chỉ.',staff:'An',image:'',adminNote:'Làm trước khi in bill.',staffNote:'',status:'todo',logs:[logText('Admin tạo việc')]},
{id:uid(),date:t,time:'09:00',title:'Gọi đơn nháp',content:'Gọi lại toàn bộ đơn hôm qua chưa nghe máy.',staff:'Nguyệt',image:'',adminNote:'Ghi chú lý do khách chưa chốt.',staffNote:'',status:'todo',logs:[logText('Admin tạo việc')]},
{id:uid(),date:t,time:'15:00',title:'Check DVVC',content:'Kiểm tra các đơn giao thất bại và báo shop xử lý.',staff:'Thủy',image:'',adminNote:'Ưu tiên Viettel và GHN.',staffNote:'',status:'done',logs:[logText('Admin tạo việc'),logText('Thủy bấm đã xong')]}
], repeat:[
{id:uid(),time:'08:30',title:'In bill đơn hôm qua',content:'Lọc đơn đã chốt, in bill chuẩn bị soạn hàng.',staff:'Linh',image:'',adminNote:'Ngày nào cũng làm.',active:true,logs:[logText('Admin tạo mẫu lặp')]},
{id:uid(),time:'17:30',title:'Đóng ca cuối ngày',content:'Check tin mới, đơn nháp, DVVC, backup dữ liệu.',staff:'An',image:'',adminNote:'Không được bỏ qua.',active:true,logs:[logText('Admin tạo mẫu lặp')]}
]}}
function logText(action){return {time:new Date().toLocaleString('vi-VN'),action}}
function init(){let id=localStorage.getItem('task_device_id'); if(!id){id='PC-'+Math.random().toString(36).slice(2,6).toUpperCase(); localStorage.setItem('task_device_id',id)} state.deviceId=id; document.getElementById('deviceText').textContent='ID đang mở: '+id+' • Online demo'; document.getElementById('filterDate').value=today(); fillStaffs(); touchDevice(); setInterval(touchDevice,30000); ['role','filterDate','filterStaff','filterStatus','filterSearch'].forEach(x=>document.getElementById(x).addEventListener('input',render)); render(); setInterval(checkReminders,20000)}
function fillStaffs(){const data=load(); const opts=['Tất cả',...data.employees]; for(const id of ['filterStaff','staff']){document.getElementById(id).innerHTML=opts.map(s=>`<option value="${s}">${s}</option>`).join('')} document.getElementById('filterStaff').value='Tất cả'}
function touchDevice(){const data=load(); data.devices[state.deviceId]={name:state.deviceId,lastSeen:Date.now(),online:true}; save(data)}
function setTab(tab){state.tab=tab; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); document.getElementById('formTitle').textContent=tab==='repeat'?'Thêm mẫu lặp lại':'Thêm việc theo ngày'; document.getElementById('repeatOptions').classList.toggle('hidden',tab==='repeat'); render()}
function isAdmin(){return document.getElementById('role').value==='admin'}
function taskList(){const data=load(); let arr=state.tab==='repeat'?data.repeat:data.daily; if(state.tab==='devices') return []; if(state.tab==='today'){const d=document.getElementById('filterDate').value; arr=arr.filter(x=>x.date===d)} const staff=document.getElementById('filterStaff').value, st=document.getElementById('filterStatus').value, q=document.getElementById('filterSearch').value.toLowerCase().trim(); if(staff!=='Tất cả') arr=arr.filter(x=>x.staff===staff); if(st!=='all' && state.tab!=='repeat') arr=arr.filter(x=>calcStatus(x)===st); if(q) arr=arr.filter(x=>(x.title+x.content+x.adminNote+(x.staffNote||'')).toLowerCase().includes(q)); return arr.sort((a,b)=>a.time.localeCompare(b.time))}
function calcStatus(x){if(x.status==='done')return 'done'; if(x.date===today() && x.time<nowTime()) return 'late'; return 'todo'}

function esc(v){return String(v||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function shortText(text, limit=85){
  const raw=String(text||'');
  const safe=esc(raw);
  if(raw.length<=limit) return `<div class="clip note">${safe}</div>`;
  return `<div class="clip note">${safe}</div><button class="morebtn" onclick="showText('${esc(raw).replace(/`/g,'&#96;')}')">Xem thêm</button>`;
}
function showText(txt){
  document.getElementById('detailBody').innerHTML=`<h2>Nội dung đầy đủ</h2><div class="log" style="white-space:pre-wrap;font-size:15px;line-height:1.5">${txt}</div><div class="actions"><button class="btn2" onclick="closeDetail()">Đóng</button></div>`;
  document.getElementById('detailModal').classList.add('show');
}
let noteTimers={};
function autoSaveStaffNote(id,el){
  clearTimeout(noteTimers[id]);
  noteTimers[id]=setTimeout(()=>{
    const {data,task}=findTask(id);
    if(!task) return;
    task.staffNote=el.value;
    task.logs=task.logs||[];
    task.logs.push(logText('Tự lưu NV ghi chú'));
    save(data);
    const ok=document.getElementById('saved_'+id);
    if(ok){ok.classList.add('show'); setTimeout(()=>ok.classList.remove('show'),900)}
    renderStats();
  },450);
}
function setColgroup(){
  const cg=document.getElementById('colgroup');
  if(!cg) return;
  cg.innerHTML = state.tab==='repeat'
  ? `<col style="width:70px"><col style="width:160px"><col style="width:310px"><col style="width:100px"><col style="width:80px"><col style="width:260px"><col style="width:90px"><col style="width:80px"><col style="width:190px">`
  : `<col style="width:70px"><col style="width:160px"><col style="width:320px"><col style="width:100px"><col style="width:80px"><col style="width:230px"><col style="width:250px"><col style="width:95px"><col style="width:80px"><col style="width:190px">`;
}

function renderStats(){const data=load(); const todayTasks=data.daily.filter(x=>x.date===document.getElementById('filterDate').value); const todo=todayTasks.filter(x=>calcStatus(x)==='todo').length, late=todayTasks.filter(x=>calcStatus(x)==='late').length, done=todayTasks.filter(x=>calcStatus(x)==='done').length; const online=Object.values(data.devices).filter(d=>Date.now()-d.lastSeen<90000).length; document.getElementById('stats').innerHTML=`<div class="stat"><b>${todayTasks.length}</b><span>Tổng việc ngày</span></div><div class="stat"><b>${todo}</b><span>Chưa làm</span></div><div class="stat"><b>${late}</b><span>Quá giờ</span></div><div class="stat"><b>${done}</b><span>Đã xong</span></div><div class="stat"><b>${online}</b><span>Thiết bị online</span></div>`}
function render(){renderStats(); document.querySelectorAll('.admin-only').forEach(e=>e.classList.toggle('hidden',!isAdmin())); if(state.tab==='devices') return renderDevices(); document.getElementById('mainGrid').classList.toggle('grid',true); document.getElementById('mainGrid').classList.toggle('form-collapsed', !state.formOpen); setColgroup(); document.getElementById('thead').innerHTML=state.tab==='repeat'?`<tr><th>Giờ</th><th>Tên CV</th><th>Nội dung</th><th>Nhân viên</th><th>Ảnh</th><th>Admin ghi chú</th><th>Bật/Tắt</th><th>Lịch sử</th><th>Thao tác</th></tr>`:`<tr><th>Giờ</th><th>Tên CV</th><th>Nội dung</th><th>Nhân viên</th><th>Ảnh</th><th>Admin ghi chú</th><th>NV ghi chú</th><th>Trạng thái</th><th>Lịch sử</th><th>Thao tác</th></tr>`;
 const rows=taskList(); document.getElementById('tbody').innerHTML=rows.map(rowHtml).join('')||`<tr><td colspan="10" class="small">Không có việc phù hợp bộ lọc.</td></tr>`}
function rowHtml(x){
 let img=x.image?`<img class="imgthumb" src="${esc(x.image)}" onclick="openDetail('${x.id}')">`:'<span class="small">Không có</span>';
 if(state.tab==='repeat') return `<tr><td class="time">${x.time}</td><td class="title">${esc(x.title)}<div class="badge repeat">Lặp hằng ngày</div></td><td>${shortText(x.content,110)}</td><td>${esc(x.staff)}</td><td>${img}</td><td>${shortText(x.adminNote||'',95)}</td><td>${x.active?'🟢 Bật':'🔴 Tắt'}</td><td>${x.logs?.length||0} dòng</td><td><div class="actions compact"><button class="btn2" onclick="openDetail('${x.id}')">Chi tiết</button>${isAdmin()?`<button class="btn-edit" onclick="editTask('${x.id}')">Sửa</button><button class="btn-danger" onclick="deleteTask('${x.id}')">Xóa</button>`:''}</div></td></tr>`;
 const st=calcStatus(x), cls=st==='done'?'done':st==='late'?'late':'todo', name=st==='done'?'Đã xong':st==='late'?'Quá giờ':'Chưa làm';
 const staffNoteBox = `<textarea class="note-edit" oninput="autoSaveStaffNote('${x.id}',this)" placeholder="NV ghi chú...">${esc(x.staffNote||'')}</textarea><div class="autosaved" id="saved_${x.id}">Đã tự lưu</div>${(x.staffNote||'').length>80?`<button class="morebtn" onclick="showText('${esc(x.staffNote).replace(/`/g,'&#96;')}')">Xem thêm</button>`:''}`;
 const adminActions = isAdmin()
   ? `<button class="btn-edit" onclick="editTask('${x.id}')">Sửa</button><button class="btn-danger" onclick="deleteTask('${x.id}')">Xóa</button>`
   : '';
 const statusAction = st==='done'
   ? (isAdmin()?`<button class="btn-reopen" onclick="reopenTask('${x.id}')">Mở lại</button>`:'')
   : `<button class="btn-done" onclick="doneTask('${x.id}')">Xong</button>`;
 return `<tr class="${st==='late'?'late-row':st==='done'?'':'todo-row'}"><td class="time">${x.time}</td><td class="title">${esc(x.title)}</td><td>${shortText(x.content,115)}</td><td>${esc(x.staff)}</td><td>${img}</td><td>${shortText(x.adminNote||'',90)}</td><td>${staffNoteBox}</td><td><span class="badge ${cls}">${name}</span></td><td>${x.logs?.length||0} dòng</td><td><div class="actions compact"><button class="btn2" onclick="openDetail('${x.id}')">Chi tiết</button>${statusAction}${adminActions}</div></td></tr>`}
function renderDevices(){document.getElementById('mainGrid').classList.remove('grid'); document.getElementById('formPanel').classList.add('hidden'); document.getElementById('thead').innerHTML='<tr><th>ID thiết bị</th><th>Trạng thái</th><th>Lần cuối mở</th></tr>'; const data=load(), rows=Object.entries(data.devices).map(([id,d])=>{const diff=Math.round((Date.now()-d.lastSeen)/1000), on=diff<90; return `<tr><td class="title">${id}</td><td>${on?'🟢 Online':'🔴 Offline '+Math.round(diff/60)+' phút'}</td><td>${new Date(d.lastSeen).toLocaleString('vi-VN')}</td></tr>`}).join(''); document.getElementById('tbody').innerHTML=rows||'<tr><td colspan="3">Chưa có thiết bị.</td></tr>'}
function fileToDataUrl(file){return new Promise(res=>{if(!file)return res(''); const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file)})}
async function saveTask(){const data=load(), file=document.getElementById('imageFile').files[0]; const newImg=(await fileToDataUrl(file))||document.getElementById('imageUrl').value.trim(); const obj={id:state.editId||uid(),time:val('time'),title:val('title'),content:val('content'),staff:val('staff'),image:newImg,adminNote:val('adminNote')}; if(!obj.time||!obj.title||!obj.content){alert('Nhập đủ thời gian, tên CV, nội dung');return} if(state.tab==='repeat'){obj.active=true; const i=data.repeat.findIndex(x=>x.id===obj.id); if(i>=0){ if(!obj.image) obj.image=data.repeat[i].image||''; data.repeat[i]={...data.repeat[i],...obj,logs:[...(data.repeat[i].logs||[]),logText('Admin sửa mẫu lặp')]}; } else data.repeat.push({...obj,logs:[logText('Admin tạo mẫu lặp')]}); } else {obj.date=document.getElementById('filterDate').value; const i=data.daily.findIndex(x=>x.id===obj.id); if(i>=0){ if(!obj.image) obj.image=data.daily[i].image||''; data.daily[i]={...data.daily[i],...obj,logs:[...(data.daily[i].logs||[]),logText('Admin sửa việc')]}; } else data.daily.push({...obj,staffNote:'',status:'todo',logs:[logText('Admin tạo việc')]}); } save(data); clearForm(); toggleForm(false); render()}
function val(id){return document.getElementById(id).value.trim()}
function clearForm(){state.editId=null; ['time','title','content','imageUrl','adminNote'].forEach(id=>document.getElementById(id).value=''); document.getElementById('imageFile').value=''}
function findTask(id){const data=load(); return {data,tab:data.daily.some(x=>x.id===id)?'daily':'repeat',task:[...data.daily,...data.repeat].find(x=>x.id===id)}}
function doneTask(id){const {data,task}=findTask(id); task.status='done'; task.logs.push(logText('Bấm đã xong trên '+state.deviceId)); save(data); render()}
function reopenTask(id){const {data,task}=findTask(id); task.status='todo'; task.logs.push(logText('Admin mở lại việc')); save(data); render()}
function staffNote(id){const {data,task}=findTask(id); const note=prompt('Nhân viên ghi chú:',task.staffNote||''); if(note!==null){task.staffNote=note; task.logs.push(logText('Nhân viên ghi chú')); save(data); render()}}
function editTask(id){const {task,tab}=findTask(id); if(tab==='repeat') setTab('repeat'); else setTab('today'); state.editId=id; toggleForm(true); document.getElementById('time').value=task.time; document.getElementById('staff').value=task.staff; document.getElementById('title').value=task.title; document.getElementById('content').value=task.content; document.getElementById('imageUrl').value=task.image||''; document.getElementById('adminNote').value=task.adminNote||''}
function deleteTask(id){if(!confirm('Xóa việc này?'))return; const data=load(); data.daily=data.daily.filter(x=>x.id!==id); data.repeat=data.repeat.filter(x=>x.id!==id); save(data); render()}
function openDetail(id){const found=findTask(id), task=found.task, tab=found.tab, data=found.data; if(tab==='daily') task.logs.push(logText('Đã mở chi tiết trên '+state.deviceId)); const img=task.image?`<p><img src="${task.image}"></p>`:''; document.getElementById('detailBody').innerHTML=`<h2>${task.title}</h2><p><b>Giờ:</b> ${task.time} ${task.date?(' • <b>Ngày:</b> '+task.date):''}</p><p><b>Nhân viên:</b> ${task.staff}</p><p><b>Nội dung:</b><br>${task.content}</p>${img}<p><b>Admin ghi chú:</b><br>${task.adminNote||''}</p>${tab==='daily'?`<p><b>Nhân viên ghi chú:</b><br>${task.staffNote||''}</p>`:''}<h3>Lịch sử thao tác</h3>${(task.logs||[]).map(l=>`<div class="log"><b>${l.time}</b><br>${l.action}</div>`).join('')}<div class="actions"><button class="btn2" onclick="closeDetail()">Đóng</button>${tab==='daily'&&task.status!=='done'?`<button class="btn-ok" onclick="doneTask('${task.id}');closeDetail()">Xong</button>`:''}</div>`; save(data); document.getElementById('detailModal').classList.add('show');}
function closeDetail(){document.getElementById('detailModal').classList.remove('show')}
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal') closeDetail()})
function resetDemo(){localStorage.removeItem(LS); location.reload()}
function showAllToday(){document.getElementById('filterDate').value=today(); document.getElementById('filterStaff').value='Tất cả'; document.getElementById('filterStatus').value='all'; document.getElementById('filterSearch').value=''; render()}
function checkReminders(){if(state.tab!=='today')return; const data=load(); const due=data.daily.find(x=>x.date===today()&&x.status!=='done'&&x.time<=nowTime()&&!x.notified); if(due){due.notified=true; due.logs.push(logText('Hệ thống popup nhắc việc')); save(data); showToast(due); render()}}
function showToast(t){const el=document.getElementById('toast'); el.innerHTML=`<h3>🔔 ${t.time} - ${t.title}</h3><div>${t.content}</div><div class="small">Nhân viên: ${t.staff}</div><div class="actions"><button class="btn2" onclick="openDetail('${t.id}');hideToast()">Chi tiết</button><button class="btn-ok" onclick="doneTask('${t.id}');hideToast()">Đã xong</button><button class="btn-warn" onclick="hideToast()">Ẩn</button></div>`; el.classList.add('show'); try{new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=').play()}catch(e){}}
function hideToast(){document.getElementById('toast').classList.remove('show')}
init();
</script>
