<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhắc việc Shop - Bảng công việc</title>
<style>
:root{
  --bg:#eef2f7;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe4ef;
  --blue:#2563eb;--blue2:#1d4ed8;--red:#dc2626;--green:#16a34a;--orange:#f59e0b;
  --softBlue:#eff6ff;--softRed:#fef2f2;--softGreen:#ecfdf5;--softOrange:#fff7ed;
  --shadow:0 10px 30px rgba(15,23,42,.08);--radius:14px;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:14px}
.header{height:58px;background:#0b1220;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 2px 10px rgba(0,0,0,.2);position:sticky;top:0;z-index:20}
.brand{display:flex;gap:10px;align-items:center}.brand h1{font-size:19px;margin:0}.sub{font-size:12px;color:#cbd5e1;margin-top:2px}.right{display:flex;gap:10px;align-items:center}
select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;outline:none}select:focus,input:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px #dbeafe}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn{background:#e2e8f0;color:#0f172a}.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue2)}.btn-red{background:var(--red);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-orange{background:var(--orange);color:#111827}.btn-soft{background:#f1f5f9;color:#0f172a}.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{max-width:1560px;margin:14px auto;padding:0 12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{padding:12px;display:grid;grid-template-columns:160px 180px 180px 1fr auto auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field input,.field select{width:100%}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(15,23,42,.04)}.stat b{font-size:28px;line-height:1}.stat div{color:var(--muted);font-size:13px;margin-top:2px}.stat.hot{border-color:#fecaca;background:linear-gradient(0deg,#fff,#fff7f7)}.stat.wait{border-color:#fed7aa;background:var(--softOrange)}
.tabs{display:flex;gap:8px;padding:10px}.tab{background:#f1f5f9}.tab.active{background:var(--blue);color:white}
.tablebox{overflow:auto;border-radius:var(--radius)}table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;min-width:1280px}th{position:sticky;top:58px;background:#f8fafc;color:#334155;text-align:left;font-size:12px;border-bottom:1px solid var(--line);padding:11px;z-index:8}td{border-bottom:1px solid var(--line);padding:10px 11px;vertical-align:middle}tr:hover td{background:#f8fafc}.time{font-weight:900;font-size:16px;white-space:nowrap}.title{font-weight:900}.twoline{max-width:310px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}.note{max-width:220px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 11px;font-weight:900;font-size:12px;white-space:nowrap}.p-red{background:#fee2e2;color:#991b1b}.p-green{background:#dcfce7;color:#166534}.p-orange{background:#ffedd5;color:#9a3412}.p-blue{background:#dbeafe;color:#1e40af}.row-overdue td{background:#fff7f7}.row-pending td{background:#fff}.row-done{opacity:.74}.actions{display:flex;gap:7px;white-space:nowrap}.tiny{padding:8px 10px;font-size:12px}.imgbadge{font-weight:800;color:#1d4ed8;background:#dbeafe;border-radius:999px;padding:6px 9px;display:inline-block}.empty{padding:48px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal.show{display:flex}.dialog{background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.25);width:min(900px,96vw);max-height:92vh;overflow:auto}.dialog-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font-size:20px;margin:0}.dialog-body{padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid1{display:grid;gap:12px}.full{grid-column:1/-1}textarea{min-height:86px;resize:vertical;width:100%}.dialog-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.detail-grid{display:grid;grid-template-columns:160px 1fr;gap:8px 14px}.k{color:var(--muted);font-weight:700}.history{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:170px;overflow:auto}.history div{padding:6px 0;border-bottom:1px dashed #dbe4ef}.history div:last-child{border-bottom:0}.preview{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px}.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:14px 16px;border-radius:14px;box-shadow:var(--shadow);display:none;z-index:70;font-weight:800}.toast.show{display:block}.notify{position:fixed;right:18px;top:76px;width:360px;background:#fff;border:2px solid #fb923c;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);z-index:60;display:none;overflow:hidden}.notify.show{display:block}.notify h3{margin:0;background:#fff7ed;padding:14px 16px;color:#9a3412}.notify .nbody{padding:14px 16px}.notify .nbtn{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.right{gap:6px}.brand h1{font-size:16px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div style="font-size:24px">🔔</div><div><h1>Nhắc Việc Shop</h1><div class="sub" id="deviceInfo"></div></div></div>
  <div class="right"><select id="role"><option value="admin">Admin</option><option value="staff">Nhân viên</option></select><select id="loginStaff"><option>An</option><option>Nguyệt</option><option>Thủy</option><option>Hà</option></select><button class="btn" id="resetBtn">Reset demo</button></div>
</header>
<main class="wrap">
  <section class="panel tabs"><button class="tab active" data-tab="today">Hôm nay</button><button class="tab" data-tab="repeat">Việc lặp lại</button><button class="tab" data-tab="devices">Thiết bị online</button></section>
  <section class="panel toolbar">
    <div class="field"><label>Ngày</label><input type="date" id="fDate"></div>
    <div class="field"><label>Nhân viên</label><select id="fStaff"><option value="all">Tất cả</option><option>An</option><option>Nguyệt</option><option>Thủy</option><option>Hà</option></select></div>
    <div class="field"><label>Trạng thái</label><select id="fStatus"><option value="focus">Tập trung chưa xong</option><option value="all">Tất cả</option><option value="pending">Chưa làm</option><option value="overdue">Quá giờ</option><option value="done">Đã xong</option></select></div>
    <div class="field"><label>Tìm kiếm</label><input id="fSearch" placeholder="Tên CV / nội dung / ghi chú"></div>
    <button class="btn-primary" id="addBtn">+ Tạo việc</button><button class="btn" id="todayBtn">Hôm nay</button>
  </section>
  <section class="stats">
    <div class="stat"><b id="sTotal">0</b><div>Tổng việc ngày</div></div><div class="stat hot"><b id="sPending">0</b><div>Chưa làm</div></div><div class="stat wait"><b id="sOver">0</b><div>Quá giờ</div></div><div class="stat"><b id="sDone">0</b><div>Đã xong</div></div><div class="stat"><b id="sOnline">1</b><div>Thiết bị online</div></div>
  </section>
  <section class="panel tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></section>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">Tạo việc</h2><button class="btn" onclick="closeModal()">Đóng</button></div><div class="dialog-body" id="modalBody"></div><div class="dialog-foot" id="modalFoot"></div></div></div>
<div class="notify" id="notify"><h3>🔔 Việc cần làm</h3><div class="nbody" id="notifyBody"></div><div class="nbtn"><button class="btn-green" id="nDone">Đã xong</button><button class="btn-orange" id="nLater">Nhắc lại 10p</button></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
const today=()=>new Date().toISOString().slice(0,10); const nowHM=()=>new Date().toTimeString().slice(0,5);
const uid=()=>Math.random().toString(36).slice(2,9); const staffList=['An','Nguyệt','Thủy','Hà'];
let deviceId=localStorage.deviceId||('PC-'+Math.random().toString(36).slice(2,6).toUpperCase()); localStorage.deviceId=deviceId;
let state=JSON.parse(localStorage.taskProDemo||'null')||seed(); let tab='today'; let editId=null;
function seed(){const d=today(); return {tasks:[
{id:uid(),date:d,time:'08:00',title:'Check tin nhắn mới',content:'Kiểm tra toàn bộ tin nhắn khách chưa trả lời. Ưu tiên khách hỏi size, đổi màu, chốt nhanh.',staff:'An',image:'',adminNote:'Làm trước khi in bill.',staffNote:'',status:'pending',repeat:false,logs:[log('Admin tạo việc')]},
{id:uid(),date:d,time:'09:00',title:'Gọi đơn nháp',content:'Gọi lại toàn bộ đơn hôm qua chưa nghe máy, ghi chú lý do khách chưa chốt.',staff:'Nguyệt',image:'',adminNote:'Ghi rõ khách hẹn ngày nào.',staffNote:'',status:'pending',repeat:false,logs:[log('Admin tạo việc')]},
{id:uid(),date:d,time:'15:00',title:'Check DVVC',content:'Kiểm tra đơn giao thất bại và báo shop xử lý.',staff:'Thủy',image:'',adminNote:'Ưu tiên Viettel và GHN.',staffNote:'Đã xử lý các đơn gấp.',status:'done',repeat:false,logs:[log('Admin tạo việc'),log('Thủy bấm đã xong')]}
],repeats:[{id:uid(),time:'08:30',title:'Check tin mới mỗi ngày',content:'Mở tất cả kênh chat và lọc tin khách chưa trả lời.',staff:'An',image:'',adminNote:'Việc lặp tự sinh mỗi ngày',active:true}],devices:{[deviceId]:{name:'Máy đang mở',lastSeen:Date.now()}}}}
function save(){localStorage.taskProDemo=JSON.stringify(state)} function log(text){return {time:new Date().toLocaleString('vi-VN'),text,device:deviceId}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function role(){return $('#role').value} function isAdmin(){return role()==='admin'}
function applyRole(){const staff=$('#loginStaff').value; if(!isAdmin()){ $('#fStaff').value=staff; $('#fStaff').disabled=true; $('#addBtn').style.display='none'} else {$('#fStaff').disabled=false;$('#addBtn').style.display='inline-block'} render()}
function render(){save(); $('#deviceInfo').textContent=`ID đang mở: ${deviceId} · Online demo`; $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); if(tab==='today') renderTasks(); if(tab==='repeat') renderRepeats(); if(tab==='devices') renderDevices(); renderStats();}
function filtered(){let arr=state.tasks.filter(t=>t.date===$('#fDate').value); const st=$('#fStaff').value, ss=$('#fStatus').value, q=$('#fSearch').value.toLowerCase().trim(); if(st!=='all') arr=arr.filter(t=>t.staff===st); if(ss==='focus') arr=arr.filter(t=>t.status!=='done'); if(ss==='pending') arr=arr.filter(t=>t.status==='pending'&&!overdue(t)); if(ss==='overdue') arr=arr.filter(t=>t.status!=='done'&&overdue(t)); if(ss==='done') arr=arr.filter(t=>t.status==='done'); if(q) arr=arr.filter(t=>(t.title+t.content+t.adminNote+t.staffNote+t.staff).toLowerCase().includes(q)); return arr.sort((a,b)=>(a.status==='done')-(b.status==='done')||a.time.localeCompare(b.time));}
function overdue(t){return t.status!=='done' && t.date===today() && t.time<nowHM()}
function statusPill(t){if(t.status==='done') return '<span class="pill p-green">✅ Đã xong</span>'; if(overdue(t)) return '<span class="pill p-red">🔥 Quá giờ</span>'; return '<span class="pill p-orange">⏳ Chưa làm</span>'}
function renderTasks(){ $('#thead').innerHTML='<tr><th>Giờ</th><th>Tên CV</th><th>Nội dung cần làm</th><th>Nhân viên</th><th>Ảnh</th><th>Admin ghi chú</th><th>NV ghi chú</th><th>Trạng thái</th><th>Lịch sử</th><th>Thao tác</th></tr>'; const arr=filtered(); if(!arr.length){$('#tbody').innerHTML='<tr><td colspan="10" class="empty">Không có việc phù hợp bộ lọc</td></tr>';return} $('#tbody').innerHTML=arr.map(t=>`<tr class="${t.status==='done'?'row-done':overdue(t)?'row-overdue':'row-pending'}"><td class="time">${t.time}</td><td class="title">${esc(t.title)}</td><td><div class="twoline">${esc(t.content)}</div></td><td><b>${esc(t.staff)}</b></td><td>${t.image?'<span class="imgbadge">Có ảnh</span>':'<span style="color:#64748b">Không</span>'}</td><td><div class="twoline note">${esc(t.adminNote||'')}</div></td><td><div class="twoline note">${esc(t.staffNote||'')}</div></td><td>${statusPill(t)}</td><td><button class="btn-soft tiny" onclick="detail('${t.id}')">${t.logs.length} dòng</button></td><td><div class="actions"><button class="btn-soft tiny" onclick="detail('${t.id}')">Chi tiết</button>${t.status!=='done'?`<button class="btn-green tiny" onclick="doneTask('${t.id}')">Đã xong</button>`:''}<button class="btn-orange tiny" onclick="staffNote('${t.id}')">Ghi chú</button>${isAdmin()?`<button class="btn tiny" onclick="editTask('${t.id}')">Sửa</button><button class="btn-red tiny" onclick="delTask('${t.id}')">Xóa</button>`:''}</div></td></tr>`).join('')}
function renderRepeats(){ $('#thead').innerHTML='<tr><th>Giờ</th><th>Tên CV</th><th>Nội dung cần làm</th><th>Nhân viên</th><th>Ảnh</th><th>Admin ghi chú</th><th>Trạng thái</th><th>Thao tác</th></tr>'; $('#tbody').innerHTML=state.repeats.map(r=>`<tr><td class="time">${r.time}</td><td class="title">${esc(r.title)}</td><td><div class="twoline">${esc(r.content)}</div></td><td><b>${esc(r.staff)}</b></td><td>${r.image?'<span class="imgbadge">Có ảnh</span>':'Không'}</td><td>${esc(r.adminNote||'')}</td><td>${r.active?'<span class="pill p-blue">Đang bật</span>':'<span class="pill">Tắt</span>'}</td><td>${isAdmin()?`<button class="btn tiny" onclick="editRepeat('${r.id}')">Sửa</button> <button class="btn-red tiny" onclick="delRepeat('${r.id}')">Xóa</button>`:'Chỉ xem'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Chưa có việc lặp</td></tr>'}
function renderDevices(){ $('#thead').innerHTML='<tr><th>ID thiết bị</th><th>Tên hiển thị</th><th>Trạng thái</th><th>Lần cuối</th></tr>'; $('#tbody').innerHTML=Object.entries(state.devices).map(([id,d])=>`<tr><td><b>${id}</b></td><td>${d.name}</td><td><span class="pill p-green">Online demo</span></td><td>${new Date(d.lastSeen).toLocaleString('vi-VN')}</td></tr>`).join('')}
function renderStats(){const all=state.tasks.filter(t=>t.date===$('#fDate').value); $('#sTotal').textContent=all.length; $('#sPending').textContent=all.filter(t=>t.status!=='done').length; $('#sOver').textContent=all.filter(overdue).length; $('#sDone').textContent=all.filter(t=>t.status==='done').length; $('#sOnline').textContent=Object.keys(state.devices).length}
function form(t={}){return `<div class="grid2"><div class="field"><label>Thời gian</label><input type="time" id="mTime" value="${t.time||''}"></div><div class="field"><label>Nhân viên</label><select id="mStaff">${staffList.map(s=>`<option ${t.staff===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Tên CV</label><input id="mTitle" value="${esc(t.title||'')}" placeholder="VD: Gọi đơn nháp"></div><div class="field full"><label>Nội dung cần làm</label><textarea id="mContent">${esc(t.content||'')}</textarea></div><div class="field full"><label>Ảnh hiển thị URL hoặc chọn ảnh</label><input id="mImage" value="${esc(t.image||'')}" placeholder="Dán link ảnh hoặc bỏ trống"><input type="file" id="mFile" accept="image/*" style="margin-top:8px"></div><div class="field full"><label>Admin ghi chú</label><textarea id="mAdminNote">${esc(t.adminNote||'')}</textarea></div><label class="full"><input type="checkbox" id="mRepeat" ${t.repeat?'checked':''}> Lặp lại mỗi ngày</label></div>`}
function openModal(title,body,foot){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;$('#modal').classList.add('show')} function closeModal(){$('#modal').classList.remove('show')}
function addTask(){editId=null; openModal('Tạo công việc',form({staff:$('#loginStaff').value}),`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn-primary" onclick="saveTask()">Lưu việc</button>`)}
function editTask(id){editId=id; const t=state.tasks.find(x=>x.id===id); openModal('Sửa công việc',form(t),`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn-primary" onclick="saveTask()">Cập nhật</button>`)}
async function readFile(){const f=$('#mFile')?.files?.[0]; if(!f) return $('#mImage').value.trim(); return await new Promise(res=>{const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f)})}
async function saveTask(){const image=await readFile(); const obj={time:$('#mTime').value,title:$('#mTitle').value.trim(),content:$('#mContent').value.trim(),staff:$('#mStaff').value,image,adminNote:$('#mAdminNote').value.trim(),repeat:$('#mRepeat').checked}; if(!obj.time||!obj.title){toast('Thiếu giờ hoặc tên CV');return} if(editId){let t=state.tasks.find(x=>x.id===editId); Object.assign(t,obj); t.logs.push(log('Admin sửa việc'))} else {state.tasks.push({id:uid(),date:$('#fDate').value,status:'pending',staffNote:'',logs:[log('Admin tạo việc')],...obj}); if(obj.repeat) state.repeats.push({id:uid(),active:true,...obj})} closeModal();toast('Đã lưu');render()}
function doneTask(id){const t=state.tasks.find(x=>x.id===id); t.status='done'; t.logs.push(log(`${$('#loginStaff').value} bấm đã xong`)); toast('Đã đánh dấu xong'); render()}
function staffNote(id){const t=state.tasks.find(x=>x.id===id); openModal('Nhân viên ghi chú',`<textarea id="noteText">${esc(t.staffNote||'')}</textarea>`,`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn-primary" onclick="saveNote('${id}')">Lưu ghi chú</button>`)}
function saveNote(id){const t=state.tasks.find(x=>x.id===id); t.staffNote=$('#noteText').value; t.logs.push(log(`${$('#loginStaff').value} ghi chú`)); closeModal(); render()}
function detail(id){const t=state.tasks.find(x=>x.id===id); openModal(t.title,`<div class="detail-grid"><div class="k">Giờ</div><div><b>${t.time}</b></div><div class="k">Nhân viên</div><div>${t.staff}</div><div class="k">Nội dung</div><div>${esc(t.content)}</div><div class="k">Admin ghi chú</div><div>${esc(t.adminNote||'')}</div><div class="k">NV ghi chú</div><div>${esc(t.staffNote||'')}</div><div class="k">Trạng thái</div><div>${statusPill(t)}</div><div class="k">Ảnh</div><div>${t.image?`<img class="preview" src="${t.image}">`:'Không có ảnh'}</div><div class="k">Lịch sử</div><div class="history">${t.logs.map(l=>`<div><b>${l.time}</b> · ${esc(l.text)} · ${l.device}</div>`).join('')}</div></div>`,`<button class="btn" onclick="closeModal()">Đóng</button>${t.status!=='done'?`<button class="btn-green" onclick="doneTask('${id}');closeModal()">Đã xong</button>`:''}`)}
function delTask(id){if(confirm('Xóa việc này?')){state.tasks=state.tasks.filter(t=>t.id!==id);render()}}
function editRepeat(id){const r=state.repeats.find(x=>x.id===id); openModal('Sửa việc lặp',form(r),`<button class="btn" onclick="closeModal()">Hủy</button><button class="btn-primary" onclick="toast('Demo: phần sửa mẫu lặp sẽ đấu Firebase sau');closeModal()">Lưu</button>`)}
function delRepeat(id){if(confirm('Xóa mẫu lặp?')){state.repeats=state.repeats.filter(r=>r.id!==id);render()}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function checkNotify(){const t=state.tasks.find(x=>x.date===today()&&x.status!=='done'&&x.time<=nowHM()&&!x.notified); if(!t) return; t.notified=true; $('#notifyBody').innerHTML=`<b>${t.time} - ${esc(t.title)}</b><p>${esc(t.content)}</p><p>Nhân viên: <b>${t.staff}</b></p>`; $('#notify').classList.add('show'); $('#nDone').onclick=()=>{doneTask(t.id);$('#notify').classList.remove('show')}; $('#nLater').onclick=()=>{$('#notify').classList.remove('show');toast('Đã nhắc lại sau')}; render()}
$$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()}); ['fDate','fStaff','fStatus','fSearch'].forEach(id=>$('#'+id).addEventListener('input',render)); $('#addBtn').onclick=addTask; $('#todayBtn').onclick=()=>{$('#fDate').value=today();render()}; $('#role').onchange=applyRole; $('#loginStaff').onchange=applyRole; $('#resetBtn').onclick=()=>{localStorage.removeItem('taskProDemo');location.reload()}; $('#fDate').value=today(); state.devices[deviceId]={name:'Máy đang mở',lastSeen:Date.now()}; setInterval(()=>{state.devices[deviceId].lastSeen=Date.now();save();checkNotify()},30000); applyRole(); checkNotify();
</script>
</body>
</html>
